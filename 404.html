<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex">
  <title>Nie znaleziono strony — Tomasz Głąbicki</title>

  <!-- Ścieżki absolutne, bo 404 może wyświetlić się pod dowolnym adresem -->
  <link rel="icon" href="/tomasz-glabicki-portfolio/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/tomasz-glabicki-portfolio/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/tomasz-glabicki-portfolio/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --text: #f5f5f5; --muted: #a0a0a0; --accent: #c9a87c; --border: #242424;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --space: clamp(1.25rem, 4vw, 3rem);
    }
    html { background: var(--bg); color-scheme: dark; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      line-height: 1.65; -webkit-font-smoothing: antialiased;
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    header { padding: 1.25rem var(--space); border-bottom: 1px solid var(--border); }
    .logo { font-size: .9rem; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }

    main { flex: 1; display: flex; align-items: center; padding: 4rem var(--space); }
    .box { width: 100%; max-width: 1200px; margin: 0 auto; }
    .code { font-size: clamp(5rem, 22vw, 11rem); font-weight: 600; line-height: 1; letter-spacing: -.04em; color: var(--accent); }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin: 1rem 0 1rem; }
    h1::after { content: ""; display: block; width: 3rem; height: 2px; background: var(--accent); margin-top: 1.25rem; }
    p { color: var(--muted); font-size: 1.1rem; max-width: 460px; margin-bottom: 2rem; }

    .btns { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn { display: inline-block; padding: .85rem 1.6rem; font-size: .92rem; font-weight: 500; border: 1px solid transparent; border-radius: 2px; transition: background .25s, color .25s, border-color .25s; }
    .btn-fill { background: var(--text); color: var(--bg); }
    .btn-fill:hover { background: var(--accent); }
    .btn-line { border-color: rgba(255,255,255,.35); }
    .btn-line:hover { border-color: var(--accent); color: var(--accent); }

    footer { border-top: 1px solid var(--border); padding: 1.5rem var(--space); font-size: .85rem; color: #8a8a8a; }
  </style>
</head>
<body>
  <header>
    <a href="/tomasz-glabicki-portfolio/" class="logo">Tomasz Głąbicki</a>
  </header>

  <main>
    <div class="box">
      <div class="code" aria-hidden="true">404</div>
      <h1>Nie znaleziono strony</h1>
      <p>Strona, której szukasz, nie istnieje albo została przeniesiona. Sprawdź, czy adres jest poprawny, albo wróć na stronę główną.</p>
      <div class="btns">
        <a href="/tomasz-glabicki-portfolio/" class="btn btn-fill">Wróć na stronę główną</a>
        <a href="/tomasz-glabicki-portfolio/#projekty" class="btn btn-line">Zobacz projekty</a>
      </div>
    </div>
  </main>

  <footer>© 2026 Tomasz Głąbicki · Radom, Polska</footer>
</body>
</html>
